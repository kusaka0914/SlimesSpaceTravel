NPCs:
  - theta: -0.580512
    phi: 1.126875
    height: 0
    type: spaceSlime
    name: BoatPartsNPC
    talkTexts: [星を探している？残念だがこの惑星にはそんなものないぞ。, あー、確か近くの惑星にいいものを持っている\nでっかいやつがいるって噂を聞いたことあるな。, そこに行ってみたらどうだ？, 隣の惑星に行くならそこらへんに落ちている\nパーツを拾ってロケットで行くんだな！]
  - theta: 1.843978
    phi: -0.819546
    height: 0.196
    type: spaceSlime
    name: CrystalTutorialNPC
    talkTexts: [これはクリスタル！\n攻撃して壊せるよ！, 中にアイテムが隠れてるかもしれないから\n見つけたらどんどん壊してね！]
  - theta: 0.341478
    phi: -0.614659
    height: 0
    type: spaceSlime
    name: BigCrystalTutorialNPC
    talkTexts: [大きなクリスタルは空中溜め攻撃で壊せるよ！, 空中溜め攻撃はジャンプして強攻撃長押し！\n溜まったら離して！, "溜め攻撃の後、疲れて動けなくなっちゃうから\n弱攻撃ボタンを連打して素早く回復しよう！"]
  - theta: 3.03915
    phi: -0.460995
    height: 0
    type: spaceSlime
    name: JumpDodgeTutorialNPC
    talkTexts: [遠い足場に乗りたい時はジャンプした後に回避！]
  - theta: 1.80983
    phi: 0.495141
    height: 0
    type: spaceSlime
    name: JumpTutorialNPC
    talkTexts: [高い足場に乗りたい時はジャンプ！]
  - theta: 2.561081
