    talkTexts:
      - "見知らぬスライムさんだ！やっほ～！\nきみは...地上から来たのかな？"
      - "でも、一体どうしてこんなところまで？\nなにがあったか教えてくれる？"
      - "今、エレベーターが流行ってるみたいだよ！\nほら！あそこにも！"
      - あれに乗ったら動くのかなぁ～？
      - "あの子のエレベーターが帰ってきたみたいだよ！\n使ってみたら～？"
      - "工事が終わって裏側に行けるようになったよ...！\n最後の星がある惑星には裏から行けるけど..."
      - 裏側はこことは雰囲気が違うから気を付けて...！
      - "そんなことがあったんだね..！\nよし分かった！僕も協力するよ！"
      - "じゃあまずはほかの惑星に行って、\n星を探さないとね...！"
      - "あの子、ロケットの場所を知ってたはず！\nまずはあの子に聞いてみて～！"
      - "おかえり！すべての星を集めれたんだね！\nきみは本当にすごいよ！"
      - それで、ママはどうだった？
      - 治ったんだ！よかったね～！
      - "ここにはもう用がないかもしれないけど...\nよかったらまた遊びに来てよ！"
      - "あ！そうだそうだ！\n裏から月に行けるようになったんだ！"
      - "強い敵と戦えるみたいだから暇だったら\n行ってみてよ！"
