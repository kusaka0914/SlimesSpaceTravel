tutorials:
  - id: battle_basic
    name: 戦闘の基本
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: introduction
        text: "この惑星は敵が多そうですね...\nということで敵の倒し方を伝授します！"
        advance: confirm
      - id: attack_buttons
        text: 戦闘の基本としては敵に近づいて攻撃します！
        controllerText: 戦闘の基本としては敵に近づいてYまたはXで攻撃します！
        keyboardText: 戦闘の基本としては敵に近づいてJまたはKで攻撃します！
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.043515503
          yRatio: 0.20226543
          widthRatio: 0.246797
          heightRatio: 0.14265625
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: false
      - id: weak_attack
        text: "弱攻撃は攻撃力が低く、範囲も狭いですが、\n一定方向に連続して攻撃することができます！"
        controllerText: "Yは弱攻撃で攻撃力が低く、範囲も狭いですが、\n一定方向に連続して攻撃することができます！"
        keyboardText: "Jは弱攻撃で攻撃力が低く、範囲も狭いですが、\n一定方向に連続して攻撃することができます！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: strong_attack
        text: "強攻撃は攻撃後の隙が大きいですが\n攻撃力が高く、全方向に攻撃することができます！"
        controllerText: "Xは強攻撃で攻撃後の隙が大きいですが\n攻撃力が高く、全方向に攻撃することができます！"
        keyboardText: "Kは強攻撃で攻撃後の隙が大きいですが\n攻撃力が高く、全方向に攻撃することができます！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: combo
        text: "弱攻撃を3回、または弱攻撃2回から強攻撃のコンボを使って、\n敵に3回攻撃してみましょう！"
        controllerText: "まずはY→Y→YまたはY→Y→Xのコンボを使って、\n敵に3回攻撃してみましょう！"
        keyboardText: "J→J→JまたはJ→J→Kのコンボを使って、\n敵に3回攻撃すると敵の頭上のガードを1つ破壊できます。"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: launch_tutorial
        text: "すべてのガードを破壊すると敵が打ち上げられ、\n一方的に攻撃できるようになります。"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: lets_try
        text: まずはコンボで敵を打ち上げてみましょう！
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
  - id: enemy_break
    name: ガード破壊と空中攻撃
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: air_attack_types
        text: 空中の敵を攻撃する時は空中弱攻撃と空中回避攻撃を使います。
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.0435
          yRatio: 0.2023
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: false
      - id: air_dodge_attack
        text: "空中回避攻撃は、空中で回避して敵にぶつかることで\n自動で攻撃することです。"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: air_weak_attack
        text: "そして空中弱攻撃は最大3回しか使えませんが、\n空中回避攻撃を当てると再使用できます。"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: summary_air_attack
        text: "つまり、空中弱攻撃→空中回避攻撃→空中弱攻撃のように繰り返す\nことで絶え間なく攻撃でき、大ダメージを与えられます。"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: air_strong_attack
        text: "そして、打ち上げ解除直前になると敵が白く点滅します！\nそのタイミングで空中強攻撃を放ちましょう！"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: recover_from_stun
        text: "空中強攻撃は超強力ですが、使用後は疲労して動けなくなります。\n弱攻撃を連打することで早く回復できるので連打しましょう。"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: break_summary
        text: "ガードを破壊し打ち上げ、空中弱攻撃と空中回避攻撃を繰り返す。\n点滅したら空中強攻撃の流れを覚えて敵を倒していきましょう！"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
  - id: jewel_usage
    name: ジュエルの使い方
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.74
    textScaleRatio: 0.000333333
    pages:
      - id: introduction
        text: "ちょっと失礼！左上の青いジュエル、\n何に使うんだろうとお困りではないですか？"
        advance: confirm
      - id: generation
        text: "このジュエルは一定時間経過で生成されるもので、\n最大2個まで所持することができます。"
        advance: confirm
      - id: heal
        text: "回復操作をするとジュエルを1個消費して、\n自分の体力を1個回復させることができます。"
        controllerText: "まずLを押しながらAを押すとジュエルを1個消費して、\n自分の体力を1個回復させることができます。"
        keyboardText: "まずNを押しながらSpaceを押すとジュエルを1個消費して、\n自分の体力を1個回復させることができます。"
        advance: confirm
      - id: automatic_attack
        text: "特殊入力と弱攻撃でジュエルを1個消費して、\n一定時間自分の前にいる敵を連続で自動攻撃します。"
        controllerText: "またLを押しながらYでジュエルを1個消費して、\n一定時間自分の前にいる敵を連続で自動攻撃します。"
        keyboardText: "またNを押しながらYでジュエルを1個消費して、\n一定時間自分の前にいる敵を連続で自動攻撃します。"
        advance: confirm
      - id: automatic_attack_warning
        text: "自動攻撃の時、攻撃に集中して\n回避ができなくなるので注意してください！"
        advance: confirm
      - id: charge_start
        text: "特殊入力と強攻撃でジュエルを2個消費して、\n溜め状態になります！"
        controllerText: "そしてLを押しながらXでジュエルを2個消費して、\n溜め状態になります！"
        keyboardText: "そしてNを押しながらKでジュエルを2個消費して、\n溜め状態になります！"
        advance: confirm
      - id: charge_release_buttons
        text: 溜め状態中はボタンを離したままで大丈夫ですよ！
        controllerText: 溜め状態中はLもXも離したままで大丈夫ですよ！
        keyboardText: 溜め状態中はNもKも離したままで大丈夫ですよ！
        advance: confirm
      - id: charge_warning
        text: "溜め状態の時、溜めに集中して\n回避しか使えなくなるので注意してください！"
        advance: confirm
      - id: charged_attack
        text: "溜まったら強攻撃を押すことで敵のガードを全て破壊し、\n大ダメージを与える地上溜め攻撃を繰り出せます！"
        controllerText: "溜まったらXを押すことで敵のガードを全て破壊し、\n大ダメージを与える地上溜め攻撃を繰り出せます！"
        keyboardText: "溜まったらKを押すことで敵のガードを全て破壊し、\n大ダメージを与える地上溜め攻撃を繰り出せます！"
        advance: confirm
      - id: counter_bonus
        text: "敵が攻撃する瞬間に地上溜め攻撃を当てるとダメージが2倍に\nなってジュエルが全回復します！"
        advance: confirm
      - id: jewel_summary
        text: "ジュエルは使っても時間経過により復活するので\nどんどん使っていくのをおすすめします！"
        advance: confirm
      - id: finish
        text: "それではこれまで学んだことを活かして\n全ての敵を倒してみましょう！"
        advance: confirm
  - id: just_dodge
    name: カウンター突進
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: arrival
        text: さあ、ここが最後の惑星です！
        advance: confirm
      - id: boss
        text: この惑星にはとても大きなボスがいます。
        advance: confirm
      - id: introduction
        text: "ボスは体力が多いため、倒すのに苦労すると思います！\nということで新技を伝授します！"
        advance: confirm
      - id: timing
        text: "敵が攻撃した瞬間に、敵に向かって回避をすることで\nカウンター突進をすることができます！"
        advance: confirm
        video:
          asset: videos/battle_counter_tutorial.mp4
          xRatio: 0.0435
          yRatio: 0.2023
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: false
      - id: reward
        text: "カウンター突進が成功すると、敵のガードを全破壊し、\nジュエルを1個回復することができます！"
        advance: confirm
        video:
          asset: videos/battle_counter_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: advice
        text: "回復したいけどジュエルが足りない、\nそんな窮地に立たされた時に狙ってみてください！"
        advance: confirm
        video:
          asset: videos/battle_counter_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: finish
        text: さあ、ボスを倒しに行きましょう！
        advance: confirm
  - id: split_switch
    name: 分身とスイッチ
    repeat: everyRequest
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: transparent_platform
        text: "あれれ...この足場、透明だよ...！\nこのままでは乗れなさそう...！"
        advance: confirm
        focus:
          sequence: platforms
          index: 2
      - id: blocked_route
        text: "誰かがスイッチに乗ってくれたら\nその間に進めそうだけど...ここには君だけ..."
        advance: confirm
      - id: switch_player
        text: "そうだ！君はスライムだから分裂できるんじゃない？\n操作するスライムを切り替えてみようよ！"
        controllerText: "そうだ！君はスライムだから分裂できるんじゃない？\nZRを押して分身を作って、切り替えてみようよ！"
        keyboardText: "そうだ！君はスライムだから分裂できるんじゃない？\nOを押して分身を作って、切り替えてみようよ！"
        advance: playerSplitMerge
      - id: switched
        text: "おっ！分裂できたね！\nちょっと小さくなったけどそっくりだ！"
        advance: confirm
      - id: find_switch
        text: "分身も同様に動かすことができるから\nまずはスイッチを探し、乗ってみよう！"
        advance: confirm
  - id: switch_success
    name: スイッチ押し成功
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: page_1
        text: "スイッチ押せたね！\nこれでさっきの足場が見えるようになったはず！"
        advance: confirm
      - id: page_2
        text: ""
        controllerText: さっそくZLで切り替えて見てみようよ！
        keyboardText: さっそくYで切り替えて見てみようよ！
        advance: playerSwitch
      - id: page_3
        text: "ナイス切り替え！\nこれで分身がスイッチに乗っている間に進めるよ！"
        advance: confirm
      - id: page_4
        text: さあ！先に進んでみよう！
        advance: confirm
  - id: union
    name: 合体
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: page_1
        text: ふぅ～！ようやく登ってこれたね！
        advance: confirm
      - id: page_2
        text: "ってあれ？スイッチが2つあるよ？\n分身を連れてきて一緒に押したいね...！"
        advance: confirm
      - id: page_3
        text: ""
        controllerText: じゃあもう一度ZRを押して合体してみよう！
        keyboardText: じゃあもう一度Oを押して合体してみよう！
        advance: playerSplitMerge
      - id: page_4
        text: "ナイス合体！これで1つになれたから\nもう一度分身して、2人でスイッチを押そう！"
        advance: confirm