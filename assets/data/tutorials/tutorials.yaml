tutorials:
  - id: battle_basic
    name: 戦闘の基本
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: introduction
        text: "ここは敵が多そう...\nそうだ！敵の倒し方を教えるね！"
        advance: confirm
      - id: attack_buttons
        text: まずは敵に近づいて攻撃します！
        controllerText: 敵に近づいて、YまたはXで攻撃できるよ！
        keyboardText: 敵に近づいて、JまたはKで攻撃できるよ！
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.043515503
          yRatio: 0.20226543
          widthRatio: 0.246797
          heightRatio: 0.14265625
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: false
      - id: weak_attack
        text: "弱攻撃は攻撃力が低く、範囲も狭いですが、\n一定方向に連続して攻撃することができます！"
        controllerText: "Yは攻撃力が低いけど、\n3回まで連続攻撃できるよ！"
        keyboardText: "Jは攻撃力が低いけど、\n3回まで連続攻撃できるよ！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: strong_attack
        text: "強攻撃は攻撃後の隙が大きいですが\n攻撃力が高く、全方向に攻撃することができます！"
        controllerText: "Xは攻撃力が高いけど、\n攻撃後に少し動けなくなるんだ...！"
        keyboardText: "Kは攻撃力が高いけど、\n攻撃後に少し動けなくなるんだ...！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: combo
        text: "敵を連続で3回攻撃すると、\n敵の頭上のガードを1つ破壊できるんだ！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: launch_tutorial
        text: "すべてのガードを破壊すると敵が打ち上げられて、\n一方的に攻撃できるようになるよ！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: lets_try
        text: まずはコンボで敵を打ち上げてみましょう！
        controllerText: "まずはY→Y→YまたはY→Y→Xのコンボを使って、\nガードを壊してみよう！"
        keyboardText: "まずはJ→J→JまたはJ→J→Kのコンボを使って、\nガードを壊してみよう！"
        advance: confirm
        video:
          asset: videos/battle_basic_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
  - id: enemy_break
    name: ガード破壊と空中攻撃
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: air_attack_types
        text: ""
        controllerText: 空中の敵を攻撃する時は空中でYとBを使うよ！
        keyboardText: 空中の敵を攻撃する時は空中でJとUを使うよ！
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.0435
          yRatio: 0.2023
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: false
      - id: air_weak_attack
        text: ""
        controllerText: "空中でも3回しかYで攻撃できないけど、\nBの回避で敵にぶつかるとまた攻撃できるようになるよ！"
        keyboardText: "空中でも3回しかJで攻撃できないけど、\nUの回避で敵にぶつかるとまた攻撃できるようになるよ！"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: summary_air_attack
        text: ""
        controllerText: "つまり、Y→Y→Y→B→Y→Y→Y→...を繰り返すと、\n何度も攻撃できて、大ダメージを与えられるんだ！"
        keyboardText: "つまり、J→J→J→U→J→J→J→...を繰り返すと、\n何度も攻撃できて、大ダメージを与えられるんだ！"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: air_strong_attack
        text: ""
        controllerText: "そして、敵が白く点滅した時に空中でXを押すと、\n一番強い攻撃が出せるよ！"
        keyboardText: "そして、敵が白く点滅した時に空中でKを押すと、\n一番強い攻撃が出せるよ！"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: break_summary
        text: ""
        controllerText: "ガードを壊して打ち上げる！空中でY→Y→Y→Bを繰り返す！\n点滅したらX！これでどんどん敵を倒していこう！"
        keyboardText: "ガードを壊して打ち上げる！空中でJ→J→J→Uを繰り返す！\n点滅したらK！これでどんどん敵を倒していこう！"
        advance: confirm
        video:
          asset: videos/battle_air_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
  - id: jewel_usage
    name: ジュエルの使い方
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.74
    textScaleRatio: 0.000333333
    pages:
      - id: introduction
        text: "ちょっと失礼！左上の青いジュエル、\n何に使うんだろうって気にならない？"
        advance: confirm
      - id: generation
        text: "ジュエルは30秒に1個作られて、自然に増えるのは2個まで！\n敵が落とすジュエルを拾えば10個まで持てるよ！"
        advance: confirm
      - id: summary
        text: "ジュエルを1個使うと、回復か連続攻撃ができて、\n2個使うと溜め攻撃ができるよ！"
        advance: confirm
      - id: heal
        text: ""
        controllerText: Lを押しながらAで体力を1回復できるよ！
        keyboardText: Nを押しながらSpaceで体力を1回復できるよ！
        advance: confirm
      - id: automatic_attack
        text: "特殊入力と弱攻撃でジュエルを1個消費して、\n一定時間自分の前にいる敵を連続で自動攻撃します。"
        controllerText: "Lを押しながらYで連続攻撃できて、\n自分の前の敵を自動で攻撃できるよ！"
        keyboardText: "Nを押しながらJで連続攻撃できて、\n自分の前の敵を自動で攻撃できるよ！"
        advance: confirm
      - id: charge_start
        text: "特殊入力と強攻撃でジュエルを2個消費して、\n溜め状態になります！"
        controllerText: "Lを押しながらXで溜め状態になるよ！溜めてると\n動けないから回避でよけないといけないんだ！"
        keyboardText: "Nを押しながらKで溜め状態になるよ！溜めてると\n動けないから回避でよけないといけないんだ！"
        advance: confirm
      - id: charged_attack
        text: "溜まったら強攻撃を押すことで敵のガードを全て破壊し、\n大ダメージを与える地上溜め攻撃を繰り出せます！"
        controllerText: "溜まったら敵に近づいてXを押して！\nガードを全て壊して大ダメージを与えられるよ！"
        keyboardText: "溜まったら敵に近づいてKを押して！\nガードを全て壊して大ダメージを与えられるよ！"
        advance: confirm
      - id: counter_bonus
        text: "これは難しいけど...敵が攻撃する時に溜め攻撃を当てると\nダメージが2倍になってジュエルが全回復するよ！"
        advance: confirm
      - id: finish
        text: "これまで学んだことを活かして\n全ての敵を倒してみよう！"
        advance: confirm
  - id: just_dodge
    name: カウンター突進
    repeat: oncePerSession
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: arrival
        text: "さあ、ここが最後の惑星だよ！\nここには大きなボスがいるんだ...！"
        advance: confirm
      - id: introduction
        text: "ボスは体力もガードも多いんだ...！\nだから新しい技を教えるね！"
        advance: confirm
      - id: timing
        text: "敵が攻撃する時に、敵に向かって回避をすると\n突進して敵のガードを1つ壊せるんだ！"
        advance: confirm
        video:
          asset: videos/battle_counter_tutorial.mp4
          xRatio: 0.0435
          yRatio: 0.2023
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: false
      - id: reward
        text: "この時ジュエルも1個回復するから、\n回復したいけどジュエルがない時におすすめ！"
        advance: confirm
        video:
          asset: videos/battle_counter_tutorial.mp4
          xRatio: 0.54
          yRatio: 0.03
          widthRatio: 0.38
          heightRatio: 0.21375
          rotationDegrees: 0
          loop: true
          preserveAspectRatio: true
          flipVertical: true
      - id: finish
        text: "さあ、これまでやってきたことを使って、\nボスを倒しに行こう！"
        advance: confirm
  - id: split_switch
    name: 分身とスイッチ
    repeat: everyRequest
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: transparent_platform
        text: "あれれ...この足場、透明だよ...！\nこのままでは乗れなさそう...！"
        advance: confirm
        focus:
          sequence: platforms
          index: 2
      - id: blocked_route
        text: "誰かがスイッチに乗ってくれたら\nその間に進めそうだけど...ここには君だけ..."
        advance: confirm
      - id: switch_player
        text: "そうだ！君はスライムだから分裂できるんじゃない？\n操作するスライムを切り替えてみようよ！"
        controllerText: "そうだ！君はスライムだから分裂できるんじゃない？\nZRを押して分身を作って、切り替えてみようよ！"
        keyboardText: "そうだ！君はスライムだから分裂できるんじゃない？\nIを押して分身を作って、切り替えてみようよ！"
        advance: playerSplitMerge
      - id: switched
        text: "おっ！分裂できたね！\nちょっと小さくなったけどそっくりだ！"
        advance: confirm
      - id: find_switch
        text: "分身も同様に動かすことができるから\nまずはスイッチを探し、乗ってみよう！"
        advance: confirm
  - id: switch_success
    name: スイッチ押し成功
    repeat: everyRequest
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: page_1
        text: "スイッチ押せたね！\nこれでさっきの足場が見えるようになったはず！"
        advance: confirm
      - id: page_2
        text: ""
        controllerText: さっそくZLで切り替えて見てみようよ！
        keyboardText: さっそくYで切り替えて見てみようよ！
        advance: playerSwitch
      - id: page_3
        text: "ナイス切り替え！\nこれで分身がスイッチに乗っている間に進めるよ！"
        advance: confirm
      - id: page_4
        text: さあ！先に進んでみよう！
        advance: confirm
  - id: union
    name: 合体
    repeat: everyRequest
    textXRatio: 0.065
    textYRatio: 0.14
    textScaleRatio: 0.000333333
    pages:
      - id: page_1
        text: ふぅ～！ようやく登ってこれたね！
        advance: confirm
      - id: page_2
        text: "ってあれ？スイッチが2つあるよ？\n分身を連れてきて一緒に押したいね...！"
        advance: confirm
      - id: page_3
        text: ""
        controllerText: じゃあもう一度ZRを押して合体してみよう！
        keyboardText: じゃあもう一度Iを押して合体してみよう！
        advance: playerSplitMerge
      - id: page_4
        text: "ナイス合体！これで1つになれたから\nもう一度分身して、2人でスイッチを押そう！"
        advance: confirm