enemies:
  - type: common
    knockBackSpeed: 15
    defaultLaunchedTimer: 4
    detectionRange: 10
  - type: normal
    behaviorProfile: legacyMelee
    hp: 80
    modelPath: enemy.obj
    scale: 0.25
    speed: 1
    attack: 1
    breakCountMax: 1
    radius: 0.75
    defaultStandByAttackTimer: 6
    defaultAttackMotionTimer: 3
    attackSpeed: 1.5
  - type: normalFixed
    behaviorProfile: legacyMelee
    hp: 80
    modelPath: enemy.obj
    scale: 0.25
    speed: 0
    attack: 1
    breakCountMax: 1
    radius: 0.75
    defaultStandByAttackTimer: 2
    defaultAttackMotionTimer: 0.5
    attackSpeed: 4.5
  - type: bigFixed
    behaviorProfile: legacyMelee
    hp: 80
    modelPath: enemy.obj
    scale: 1
    speed: 0
    attack: 1
    breakCountMax: 1
    radius: 1.5
    defaultStandByAttackTimer: 2
    defaultAttackMotionTimer: 0.5
    attackSpeed: 4.5
  - type: boss
    behaviorProfile: bossMelee
    hp: 400
    modelPath: enemy.obj
    scale: 1
    speed: 3
    attack: 2
    breakCountMax: 3
    radius: 1.5
    defaultStandByAttackTimer: 3
    defaultAttackMotionTimer: 0.5
    attackSpeed: 9

behaviorProfiles:
  legacyMelee:
    actions:
      - type: idle
        weight: 1
      - type: chase
        weight: 1
      - type: meleeAttack
        weight: 1
  bossMelee:
    actions:
      - type: idle
        weight: 1
      - type: chase
        weight: 1
      - type: meleeAttack
        weight: 40
      - type: tripleChargeAttack
        weight: 30
        chargeCount: 3
        repeatDelay: 1
      - type: fanAttack
        weight: 15
        range: 6
        angleDegrees: 120
        windUpDuration: 2
        attackDuration: 0.5
      - type: radialAttack
        weight: 15
        range: 5
        windUpDuration: 2
        attackDuration: 0.5
