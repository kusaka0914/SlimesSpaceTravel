state:
  - id: battleTutorialTextForGameController
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: ["この惑星は敵が多そうですね...\nということで敵の倒し方を伝授します！", 戦闘の基本としては敵に近づいてYまたはXで攻撃します！, "Yは弱攻撃で攻撃力が低いですが、\n一定方向に連続して攻撃することができます！", "Xは強攻撃で攻撃力が高く、\n攻撃後の隙が大きいですが全方向に攻撃することができます！", "まずはY→Y→YまたはY→Y→Xのコンボを使って、\n敵に3回攻撃してみましょう！"]
  - id: battleTutorialTextForKeyBoard
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: ["この惑星は敵が多そうですね...\nということで敵の倒し方を伝授します！", 戦闘の基本としては敵に近づいてJまたはKで攻撃します！, "Jは弱攻撃で攻撃力が低いですが、\n一定方向に連続して攻撃することができます！", "Kは強攻撃で攻撃力が高く、\n攻撃後の隙が大きいですが全方向に攻撃することができます！", "まずはJ→J→JまたはJ→J→Kのコンボを使って、\n敵に3回攻撃してみましょう！"]
  - id: breakTutorialText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: ["3回攻撃できましたね！\n敵の頭上にあったガードがなくなったことに気づきましたか？", "というのも、敵に3回攻撃を当てると\nガードを1個破壊することができるのです！", "全てのガードを破壊することで\n敵を空中に打ち上げることができます！", 空中の敵を攻撃する時は空中乱舞か空中溜め攻撃を使います！, 空中乱舞はジャンプ中に弱攻撃を連打できるというものです！, "空中溜め攻撃は大きなクリスタルを壊すときに使った技です！\n強力ですが、攻撃後に少しの間動けなくなります！", "動けない時に弱攻撃ボタンを連打することで\n早く動けるようになるため、忘れずに連打しましょう！", "非常に強い技なので、ガードを全破壊して空中乱舞と\n空中溜め攻撃でサクサク敵を倒していきましょう！"]
  - id: jewelTutorialTextForGameController
    type: text
    posRatio: [0.065, 0.74]
    scaleRatio: [0.000333333, 1.0]
    text: ["ちょっと失礼！左上の青いジュエル、\n何に使うんだろうとお困りではないですか？", "このジュエルは一定時間経過で生成されるもので、\n最大2個まで所持することができます。", "まずRを押すとジュエルを1個消費して、\n自分の体力を1個回復させることができます。", "またLを押しながらYでジュエルを1個消費して、\n一定時間自分の前にいる敵を連続で自動攻撃します。", "自動攻撃の時、攻撃に集中して\n回避ができなくなるので注意してください！", "そしてLを押しながらXでジュエルを2個消費して、\n溜め状態になります！", 溜め状態中はLもXも離したままで大丈夫ですよ！, "溜め状態の時、溜めに集中して\n回避しか使えなくなるので注意してください！", "溜まったらXを押すことで敵のガードを全て破壊し、\n大ダメージを与える地上溜め攻撃を繰り出せます！", "敵が攻撃する瞬間に地上溜め攻撃を当てるとダメージが2倍に\nなってジュエルが全回復します！", "ジュエルは使っても時間経過により復活するので\nどんどん使っていくのをおすすめします！", "それではこれまで学んだことを活かして\n全ての敵を倒してみましょう！"]
  - id: jewelTutorialTextForKeyBoard
    type: text
    posRatio: [0.065, 0.74]
    scaleRatio: [0.000333333, 1.0]
    text: ["ちょっと失礼！左上の青いジュエル、\n何に使うんだろうとお困りではないですか？", "このジュエルは一定時間経過で生成されるもので、\n最大2個まで所持することができます。", "まずMを押すとジュエルを1個消費して、\n自分の体力を1個回復させることができます。", "またNを押しながらYでジュエルを1個消費して、\n一定時間自分の前にいる敵を連続で自動攻撃します。", "自動攻撃の時、攻撃に集中して\n回避ができなくなるので注意してください！", "そしてNを押しながらXでジュエルを2個消費して、\n溜め状態になります！", 溜め状態中はNもKも離したままで大丈夫ですよ！, "溜め状態の時、溜めに集中して\n回避しか使えなくなるので注意してください！", "溜まったらKを押すことで敵のガードを全て破壊し、\n大ダメージを与える地上溜め攻撃を繰り出せます！", "敵が攻撃する瞬間に地上溜め攻撃を当てるとダメージが2倍に\nなってジュエルが全回復します！", "ジュエルは使っても時間経過により復活するので\nどんどん使っていくのをおすすめします！", "それではこれまで学んだことを活かして\n全ての敵を倒してみましょう！"]
  - id: justDodgeTutorialText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: [さあ、ここが最後の惑星です！, この惑星にはとても大きなボスがいます。, "ボスは体力が多いため、倒すのに苦労すると思います！\nということで新技を伝授します！", "敵が攻撃した瞬間に、敵に向かって回避をすることで\nジャスト回避をすることができます！", "ジャスト回避が成功すると、敵のガードを全破壊し、\nジュエルを1個回復することができます！", "回復したいけどジュエルが足りない、\nそんな窮地に立たされた時に狙ってみてください！", さあ、ボスを倒しに行きましょう！]
