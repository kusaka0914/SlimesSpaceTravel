opening:
  - id: bgTexture
    type: texture
    posRatio: [0, 0]
    scaleRatio: [1, 1]
    rotationDegrees: 0
  - id: openingText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text:
      - "ある草原のど真ん中\nスライムはママと仲良く暮らしていました。"
      - "ママスライムはいつもお仕事で忙しく、\n朝早く家を出て、夕方になるまで帰ってきません。"
      - "それでも毎朝、家を出る前には必ず\nスライムの頭を優しくなでてくれました。 "
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
    centerBased: false
    rotationDegrees: 0
  - id: talkWithMotherText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text:
      - "ママ: じゃあ、お仕事に行ってくるね。"
      - "スライム: うん！ ママ、いってらっしゃい！"
      - "ママ: いい子にしてるんだよ。"
      - "スライム: はーい！"
      - それが、二人にとっていつもの朝でした。
      - ――その日も、いつもと同じ朝になるはずでした。
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
    centerBased: false
    rotationDegrees: 0
  - id: talkWithDoctorText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text:
      - ママスライムが家を出ようとした、そのときです。
      - "ママ: うっ……"
      - 突然、ママスライムがその場に倒れました。
      - "スライム: ママ！？"
      - スライムは慌てて駆け寄りました。
      - "スライム: ママ！ どうしたの！？ ママ！"
      - "何度呼びかけても、ママスライムは目を開けません。\nスライムは急いでお医者さんを呼びました。"
      - "お医者さん: ……これは、とても複雑な病気だ。"
      - "スライム: 治せる？"
      - お医者さんは少し黙ってから、首を横に振りました。
      - "お医者さん: ごめんな。今の私には治すことができない。"
      - "スライム: そんな……"
      - "お医者さん: このままでは、\nきみのママは目を覚まさないかもしれない。"
      - スライムの目から、大粒の涙がこぼれました。
      - "スライム: いやだよ……。\nママ、ずっと頑張ってたのに……。"
      - "スライム: お願い！ 何か方法はないの？\nどんな方法でもいいから！"
      - "スライムが何度も何度も頼むと、お医者さんはしばらく考え込み、\n小さな声で言いました。"
      - "お医者さん: 昔から、この宇宙のどこかに\n不思議な星があると言われているんだ。"
      - "スライム: 星？"
      - "お医者さん: ああ、全部で五つだそうだ。"
      - "お医者さん: その五つをすべて集めた者は、\nたった一つだけ、どんな願いでも叶えてもらえるという。"
      - スライムは涙をぬぐいました。
      - "スライム: じゃあ、その星を集めたら……"
      - "お医者さん: ママを助けられるかもしれない。"
      - スライムはすぐに立ち上がりました。
      - "スライム: じゃあ僕が集めてくる！"
      - "お医者さん: 待ちなさい！"
      - お医者さんは驚いてスライムを止めました。
      - "お医者さん: 宇宙がどれだけ危険な場所か分かっているのか？"
      - "スライム: 分からない。"
      - "お医者さん: だったら――"
      - "スライム: じゃあお医者さんは、ママを助けられるの？"
      - お医者さんは何も答えることができませんでした。
      - スライムはママのそばへ行きました。
      - "そして、いつも頭をなでてもらっていたように、\n今度はスライムがママの頭をそっとなでました。"
      - "スライム: ママ。\nちょっとだけ待っててね。"
      - "スライム: 僕が絶対に集めて帰ってくるから。"
      - "スライムは家を飛び出しました。\n草原を走り抜け、その先にある小さなロケットへと向かいます。"
      - "生まれて初めて見る宇宙。\nどんな星があるのかも、"
      - "どんな危険が待っているのかも、\nスライムには何も分かりません。"
      - それでも、怖くはありませんでした。
      - "ママを助けたい。\nただ、その気持ちだけを胸に――"
      - スライムはロケットに乗り込みました。
      - "スライム: 待っててね、ママ！"
      - ロケットは大きな音を立てて空へ飛び上がります。
      - "草原はどんどん小さくなり、\nやがて青い空を抜け、"
      - スライムは広い広い宇宙へと旅立っていきました。
      - "五つの星を探す、\n長い長い冒険の始まりです。"
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
    centerBased: false
    rotationDegrees: 0
ending:
  - id: bgTexture
    type: texture
    posRatio: [0, 0]
    scaleRatio: [1, 1]
    rotationDegrees: 0
  - id: endingText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text:
      - "長い長い宇宙の旅の末、\nスライムはついに5つすべての星を集めました。"
      - "傷だらけになりながらも、\nスライムは5つの星を大事そうに抱えていました。"
      - "スライム: やっと……やっと集まった！"
      - "すると、5つの星がスライムの手の中から\nふわりと浮かび上がりました。"
      - "星たちは空中でくるくると回りはじめ、\nやがてまぶしい光となって一つに重なりました。"
      - そして、どこからともなく声が聞こえてきました。
      - "？？？: 5つの星を集めし者よ。\nあなたの願いを一つだけ叶えましょう。"
      - スライムは迷いませんでした。
      - "スライム: ママを助けて！"
      - 少しの間、あたりが静かになりました。
      - "？？？: たくさんのお宝も、強い力もいらないのですか？"
      - "スライム: いらないよ！"
      - スライムは大きな声で答えました。
      - "スライム: 僕はママに、もう一度会いたい！"
      - その瞬間、5つの星がこれまでで一番強く輝きました。
      - "光は一本の大きな流れとなって、はるか遠く、\nスライムの暮らしていた草原へと飛んでいきました。"
      - "スライム: ママ……！"
      - "スライムは急いでロケットに乗り込み、\n故郷へと向かいました。"
      - そして――
      - "長い旅を終えて家の前に行くと、\nお医者さんが立っていました。"
      - スライムは息を切らしながら聞きました。
      - "スライム: ママは！？"
      - "お医者さんは何も言わず、\nにっこり笑って奥の部屋を見ていました。"
      - スライムが恐る恐る部屋へ入ると――
      - "ママ: おかえり。"
      - "そこには、ベッドの上で笑っている\nママスライムがいました。"
      - "スライム: ……ママ？"
      - "ママ: ずいぶん遠くまで行ってたみたいだね。"
      - "スライム: ママ！！"
      - スライムは勢いよくママに飛びつきました。
      - "スライム: うわあああん！ ママぁ！"
      - "ママ: よしよし。心配かけちゃったね。"
      - "スライム: ぼく、星をいっぱい探して……\nいろんなところに行って……怖いこともいっぱいあって……！"
      - "泣きながら一生懸命話すスライムを、\nママは優しく抱きしめました。"
      - "ママ: 頑張ったんだね。"
      - "スライム: うん……！"
      - "しばらくして、スライムが落ち着くと、\nママは言いました。"
      - "ママ: でもね。\nもう一人で、こんな危ないことしちゃダメだよ。"
      - "スライム: ……はーい。"
      - お医者さんはその様子を見ながら笑いました。
      - "お医者さん: まったく。\n本当に宇宙を飛び回って星を集めてくるとはな。"
      - スライムはちょっとだけ得意そうに胸を張りました。
      - "スライム: だって、ママを助けられるのは\n僕しかいなかったから！"
      - "ママ: そうだったね。"
      - ママは笑いました。
      - "次の日。\nいつもの草原に朝がやってきました。"
      - ママスライムは家の前で準備をしていました。
      - "ママ: じゃあ、お仕事に行ってくるね。"
      - "スライムは少しだけ不安そうな顔をしました。\nそんなスライムを見て、ママは優しく頭をなでました。"
      - "ママ: 大丈夫。今日はちゃんと帰ってくるよ。"
      - "スライムはしばらくママを見つめていましたが、\nやがていつもの笑顔になりました。"
      - "スライム: うん！"
      - そして大きく手を振りました。
      - "スライム: ママ、いってらっしゃい！"
      - "ママ: いってきます。"
      - "草原の向こうへ進んでいくママを、\nスライムはいつまでも見送っていました。"
      - "ふと空を見上げると、\nそこには5つの小さな光が輝いていました。"
      - スライムはそれを見て、にっこり笑いました。
      - こうして、スライムの長い長い宇宙の旅は終わりました。
      - でも――
      - "宇宙には、スライムがまだ知らない星が\nたくさんあります。"
      - "もしかするといつか、\n今度は誰かを助けるためではなく、"
      - 自分の知らない世界を見つけるために、
      - もう一度宇宙へ飛び出す日が来るのかもしれません。
      - おしまい
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
    centerBased: false
    rotationDegrees: 0
