opening:
  - id: bgTexture
    type: texture
    posRatio: [0, 0]
    scaleRatio: [1, 1]
  - id: openingText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: ["ある草原のど真ん中\nスライムはママと仲良く暮らしていました。", "ママはいつもお仕事で大忙し\nそれでもスライムを愛しているため一生懸命働いていました。", "ある日、スライムはいつものように\nママのお見送りをしていました。"]
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
  - id: talkWithMotherText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: ["スライム: ママ、いってらっしゃい！", "ママ: いってきます。\nスライム、いい子にしてるんだよ。", "ママ: !?", "ママ: ううっ...", ママが突然倒れこんでしまいました。, "スライム: どうしたの！？ママ！"]
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
  - id: talkWithDoctorText
    type: text
    posRatio: [0.065, 0.14]
    scaleRatio: [0.000333333, 1.0]
    text: [スライムは急いでドクターを呼びました。, "ドクター: これは、私にはどうしても治せない\nとてもとても複雑な病気だよ。", "ドクター: きっともう目覚めることはないだろう。", "スライム: ほ、ほんとなの、？", スライムは泣き出してしまいました。, "スライム: どうにか治す方法はないの？", "ドクター: ごめんな、普通の方法じゃ治らないんだ。\nただ...", "スライム: ただ...？", "ドクター: 一つだけ方法はあるんだが、\nこれはとても難しい方法なんだ。", "ドクター: この世界の宇宙になんでも願いを叶えてくれる\n星が存在するという話は聞いたことあるかな？", "スライム: 聞いたことないや、、", "ドクター: そうか、もしその星を全て集めて、\nお母さんの病気が治ることを願うことができれば...", "スライム: じゃあ僕が集めてくるよ！", "ドクター: ダメだダメだ！\nおまえさん、宇宙がどれだけ危険なのか分かっているのか！", "スライム: じゃあドクターはママを助けてくれるの？", "ドクター: ...", "スライム: ママを助けられるのは僕しかいない！", "そういうとスライムはすぐに家を飛び出し、\nロケットに乗り込んで宇宙へと旅立ちました。"]
    rubyScaleRatio: 0.48
    rubyGapRatio: 0
