particleEffects:
  attack_hit:
    emitters:
      # The short white-hot center flash.
      - texture: "spark_core.png"
        blendMode: "additive"
        renderMode: "billboard"
        directionMode: "sphere"
        count: 1

        lifetime:
          min: 0.065
          max: 0.095

        speed: 0.0

        size:
          start:
            min: 0.58
            max: 0.72
          endMultiplier: 0.05

        rotationDegrees:
          min: -25.0
          max: 25.0

        colorStart: [1.0, 1.0, 0.90, 1.0]
        colorEnd: [1.0, 0.38, 0.04, 0.0]

      # A wider group of long orange streaks.
      - texture: "spark_streak.png"
        blendMode: "additive"
        renderMode: "billboard"
        directionMode: "sphere"
        count: 1

        lifetime:
          min: 0.10
          max: 0.15

        speed: 0.0

        size:
          start:
            min: 0.78
            max: 0.95
          endMultiplier: 0.10

        rotationDegrees:
          min: 0.0
          max: 360.0

        colorStart: [1.0, 0.73, 0.20, 1.0]
        colorEnd: [1.0, 0.18, 0.01, 0.0]

      # Fine embers that linger slightly longer than the center flash.
      - texture: "spark_dot.png"
        blendMode: "additive"
        renderMode: "billboard"
        directionMode: "hemisphere"
        count: 2

        lifetime:
          min: 0.16
          max: 0.27

        speed:
          min: 0.30
          max: 0.85

        size:
          start:
            min: 0.34
            max: 0.46
          endMultiplier: 0.18

        rotationDegrees:
          min: 0.0
          max: 360.0

        angularVelocityDegrees:
          min: -80.0
          max: 80.0

        gravity: 0.15
        drag: 2.5

        colorStart: [1.0, 0.58, 0.10, 0.95]
        colorEnd: [1.0, 0.12, 0.01, 0.0]

  walk_start_dust:
    emitters:
      - texture: "dust_puff.png"
        blendMode: "alpha"
        renderMode: "billboard"
        directionMode: "cone"
        count: 5

        lifetime:
          min: 0.24
          max: 0.38

        speed:
          min: 0.45
          max: 1.10

        size:
          start:
            min: 0.17
            max: 0.27
          endMultiplier: 1.90

        spreadAngleDegrees: 48.0

        rotationDegrees:
          min: 0.0
          max: 360.0

        angularVelocityDegrees:
          min: -70.0
          max: 70.0

        gravity: -0.12
        drag: 3.2

        colorStart: [0.96, 0.94, 0.88, 0.74]
        colorEnd: [0.72, 0.70, 0.66, 0.0]

  landing_dust:
    emitters:
      - texture: "dust_puff.png"
        blendMode: "alpha"
        renderMode: "billboard"
        directionMode: "hemisphere"
        count: 10

        lifetime:
          min: 0.30
          max: 0.52

        speed:
          min: 0.55
          max: 1.45

        size:
          start:
            min: 0.20
            max: 0.34
          endMultiplier: 2.15

        rotationDegrees:
          min: 0.0
          max: 360.0

        angularVelocityDegrees:
          min: -90.0
          max: 90.0

        gravity: 0.18
        drag: 2.9

        colorStart: [0.98, 0.96, 0.90, 0.80]
        colorEnd: [0.70, 0.68, 0.64, 0.0]

  enemy_defeat:
    emitters:
      # Enemy disappears after this larger center flash is emitted.
      - texture: "spark_core.png"
        blendMode: "additive"
        renderMode: "billboard"
        directionMode: "sphere"
        count: 1

        lifetime:
          min: 0.12
          max: 0.18

        speed: 0.0

        size:
          start:
            min: 0.95
            max: 1.20
          endMultiplier: 0.05

        rotationDegrees:
          min: -30.0
          max: 30.0

        colorStart: [1.0, 1.0, 0.82, 1.0]
        colorEnd: [1.0, 0.30, 0.02, 0.0]

      # A wider burst distinguishes defeat from an ordinary attack hit.
      - texture: "spark_streak.png"
        blendMode: "additive"
        renderMode: "billboard"
        directionMode: "sphere"
        count: 2

        lifetime:
          min: 0.18
          max: 0.28

        speed: 0.0

        size:
          start:
            min: 1.15
            max: 1.50
          endMultiplier: 0.08

        rotationDegrees:
          min: 0.0
          max: 360.0

        angularVelocityDegrees:
          min: -100.0
          max: 100.0

        colorStart: [1.0, 0.72, 0.16, 1.0]
        colorEnd: [1.0, 0.12, 0.01, 0.0]

      # Embers continue moving after the enemy model has disappeared.
      - texture: "spark_dot.png"
        blendMode: "additive"
        renderMode: "billboard"
        directionMode: "sphere"
        count: 8

        lifetime:
          min: 0.35
          max: 0.62

        speed:
          min: 1.20
          max: 3.80

        size:
          start:
            min: 0.18
            max: 0.32
          endMultiplier: 0.10

        rotationDegrees:
          min: 0.0
          max: 360.0

        angularVelocityDegrees:
          min: -120.0
          max: 120.0

        gravity: 0.70
        drag: 1.60

        colorStart: [1.0, 0.62, 0.10, 1.0]
        colorEnd: [0.95, 0.08, 0.01, 0.0]
